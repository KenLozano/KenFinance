<ion-content [fullscreen]="true">
  <main class="login-page">
    <section class="login-card">
      <header class="login-header">
        <h1>KenFinance</h1>
        <p>Inicia sesión para continuar</p>
      </header>

      <form (ngSubmit)="login()">
        <ion-item>
          <ion-label position="stacked">
            Correo electrónico
          </ion-label>

          <ion-input
            type="email"
            name="email"
            [(ngModel)]="email"
            autocomplete="email"
            required
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">
            Contraseña
          </ion-label>

          <ion-input
            type="password"
            name="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          ></ion-input>
        </ion-item>

        @if (errorMessage()) {
  <p class="error-message">
    {{ errorMessage() }}
  </p>
}

        <ion-button
          type="submit"
          expand="block"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Iniciar sesión
          }
        </ion-button>
      </form>

      <ion-button
        type="button"
        expand="block"
        fill="outline"
        [disabled]="isLoading()"
        (click)="loginWithGoogle()"
      >
        Continuar con Google
      </ion-button>

      <nav class="login-links">
        <a routerLink="/recovery">
          ¿Olvidaste tu contraseña?
        </a>

        <a routerLink="/register">
          Crear una cuenta
        </a>
      </nav>
    </section>
  </main>
</ion-content>
