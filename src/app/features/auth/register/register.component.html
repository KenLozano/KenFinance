<ion-content [fullscreen]="true">
  <main class="auth-page">
    <section class="auth-card">
      <header>
        <h1>Crear cuenta</h1>
        <p>Empieza a organizar tus finanzas con KenFinance</p>
      </header>

      <form (ngSubmit)="register()">
        <ion-item>
          <ion-label position="stacked">Nombre</ion-label>
          <ion-input
            name="name"
            [(ngModel)]="name"
            autocomplete="name"
            required
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Correo electrónico</ion-label>
          <ion-input
            type="email"
            name="email"
            [(ngModel)]="email"
            autocomplete="email"
            required
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Contraseña</ion-label>
          <ion-input
            type="password"
            name="password"
            [(ngModel)]="password"
            autocomplete="new-password"
            required
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Confirmar contraseña</ion-label>
          <ion-input
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            autocomplete="new-password"
            required
          ></ion-input>
        </ion-item>

        @if (errorMessage) {
          <p class="error-message">
            {{ errorMessage }}
          </p>
        }

        <ion-button
          type="submit"
          expand="block"
          [disabled]="isLoading"
        >
          @if (isLoading) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Crear cuenta
          }
        </ion-button>
      </form>

      <a routerLink="/login">
        Ya tengo una cuenta
      </a>
    </section>
  </main>
</ion-content>
