<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Más</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <main class="settings-page">

    <span class="eyebrow">
      KENFINANCE
    </span>

    <h1>Más</h1>

    <p>
      Aquí se agruparán las funciones
      complementarias de KenFinance.
    </p>

    <div class="settings-preview">

  <a
    routerLink="/profile"
    class="settings-item"
  >
    Perfil
  </a>

  <a
    routerLink="/reports"
    class="settings-item"
  >
    Reportes
  </a>

  <a
    routerLink="/plan"
    class="settings-item"
  >
    Plan mensual
  </a>

  <section class="settings-section">

    <h2>
      Apariencia
    </h2>

    <p>
      Elige cómo quieres ver KenFinance.
    </p>

    <div class="theme-options">

      <button
        type="button"
        [class.active]="
          themeService.preference() ===
          'system'
        "
        (click)="setTheme('system')"
      >
        Sistema
      </button>

      <button
        type="button"
        [class.active]="
          themeService.preference() ===
          'light'
        "
        (click)="setTheme('light')"
      >
        Claro
      </button>

      <button
        type="button"
        [class.active]="
          themeService.preference() ===
          'dark'
        "
        (click)="setTheme('dark')"
      >
        Oscuro
      </button>

    </div>

  </section>

  <button
    type="button"
    class="settings-item logout"
    [disabled]="isLoggingOut()"
    (click)="logout()"
  >
    @if (isLoggingOut()) {
      Cerrando sesión...
    } @else {
      Cerrar sesión
    }
  </button>

</div>

@if (errorMessage()) {
  <p class="message error">
    {{ errorMessage() }}
  </p>
}

  </main>

</ion-content>
